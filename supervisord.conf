[supervisord]
nodaemon=true
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1365x900x24 -ac
autorestart=true
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw
autorestart=true
[program:websockify]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
[program:api]
command=/usr/local/bin/uvicorn app:app --host 127.0.0.1 --port 8000
directory=/app
environment=DISPLAY=":99"
autorestart=true
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true